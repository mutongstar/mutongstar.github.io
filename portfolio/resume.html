&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;
&lt;title&gt;Michael CV&lt;/title&gt;
&lt;style&gt;
:root{
  color-scheme:light;
  --arcoblue:#165DFF;
  --blue-1:#E8F3FF;
  --blue-2:#BEDAFF;
  --ink:#1D2129;
  --text-2:#4E5969;
  --text-3:#86909C;
  --border:#E5E6EB;
  --fill:#F7F8FA;
  --fill-2:#F2F3F5;
  --paper:#FFFFFF;
  --radius:8px;
}
*{box-sizing:border-box}
html{background:#F2F3F5}
body{
  margin:0;
  background:#F2F3F5;
  color:var(--ink);
  font-family:Inter,&quot;Helvetica Neue&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit}
.toolbar{
  max-width:900px;
  margin:20px auto 14px;
  padding:0 10px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  color:var(--text-3);
  font-size:12px;
}
.toolbar span{line-height:1.65}
.toolbar button{
  height:34px;
  padding:0 14px;
  border:1px solid var(--arcoblue);
  border-radius:var(--radius);
  background:var(--arcoblue);
  color:#fff;
  cursor:pointer;
}
.toolbar button:hover{background:#0E42D2}
.toolbar button:focus-visible{outline:3px solid var(--blue-2);outline-offset:2px}
.page{
  position:relative;
  width:210mm;
  min-height:297mm;
  margin:0 auto 22px;
  padding:15mm 17mm 12mm;
  background:var(--paper);
  box-shadow:0 4px 16px rgba(29,33,41,.08);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.page:before{
  content:&quot;&quot;;
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:5px;
  background:var(--arcoblue);
}
.eyebrow{
  color:var(--arcoblue);
  font-size:9px;
  font-weight:600;
  letter-spacing:1.8px;
  text-transform:uppercase;
}
header{
  display:grid;
  grid-template-columns:1fr 78px;
  gap:22px;
  align-items:start;
  padding:4px 0 15px 16px;
  border-left:4px solid var(--arcoblue);
  border-bottom:1px solid var(--border);
}
h1{
  margin:9px 0 6px;
  font-size:32px;
  line-height:1.1;
  letter-spacing:2px;
  font-weight:600;
}
.role{font-size:16px;font-weight:500;color:var(--text-2)}
.contact{margin-top:8px;font-size:9.5px;line-height:1.7;color:var(--text-3)}
.photo{
  width:78px;
  height:98px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--fill);
  color:var(--text-3);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:9px;
  line-height:1.6;
  overflow:visible;
  border-color:transparent;
  background:transparent;
}
.photo img{display:block;width:150%;max-width:none;height:auto;margin:-1px 0 0 -25%;object-fit:contain}
.intro{
  margin:14px 0 12px;
  font-size:11px;
  line-height:1.78;
  color:var(--text-2);
}
.profile-grid{display:grid;grid-template-columns:1.42fr .88fr;gap:18px;margin:15px 0 13px;align-items:stretch}
.profile-lead{margin:0;padding:2px 0;color:var(--text-2);font-size:11px;line-height:1.8}
.metrics{display:grid;grid-template-columns:1fr;gap:0;border-top:1px solid var(--border)}
.metric{display:grid;grid-template-columns:62px 1fr;align-items:center;padding:7px 2px;border:0;border-bottom:1px solid var(--border);border-radius:0;background:transparent}
.metric:first-child{background:transparent;border-color:var(--border)}
.metric b{display:block;color:var(--arcoblue);font-size:13px;font-weight:600;line-height:1.2}
.metric span{display:block;color:var(--text-3);font-size:8.3px;line-height:1.35}
.capabilities{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 15px}
.capabilities span{
  padding:4px 10px;
  border:1px solid var(--blue-2);
  border-radius:999px;
  background:#fff;
  color:var(--arcoblue);
  font-size:8.8px;
  font-weight:500;
}
.section-title{
  display:flex;
  align-items:center;
  gap:8px;
  margin:0 0 11px;
  color:var(--ink);
  font-size:11.5px;
  font-weight:600;
  letter-spacing:.8px;
}
.section-title:before{
  content:&quot;&quot;;
  width:4px;
  height:14px;
  border-radius:1px;
  background:var(--arcoblue);
}
.section-title:after{content:&quot;&quot;;height:1px;background:var(--border);flex:1}
.section-title small{color:var(--text-3);font-size:8px;font-weight:400;letter-spacing:.7px}
.company{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin:0 0 9px;
}
.company h3{margin:0;font-size:15px;font-weight:600}
.company h3 span{margin-left:8px;color:var(--text-3);font-size:9.5px;font-weight:400}
time{color:var(--text-3);font-size:8.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.job{
  margin:0 0 8px;
  padding:8px 10px;
  border-left:3px solid var(--arcoblue);
  border-radius:0 var(--radius) var(--radius) 0;
  background:var(--fill);
}
.jobhead{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
  margin-bottom:3px;
}
.job h4{margin:0;font-size:10.6px;font-weight:600}
.job ul{margin:0;padding-left:15px;color:var(--text-2);font-size:10px;line-height:1.62}
.job li{margin:2px 0;padding-left:1px}
.job strong{color:var(--ink);font-weight:600}
.footer{
  display:flex;
  justify-content:flex-end;
  gap:12px;
  margin-top:auto;
  padding-top:8px;
  border-top:1px solid var(--border);
  color:var(--text-3);
  font-size:8px;
}
.page-label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:4px 0 18px;
  padding:0 0 11px;
  border-bottom:1px solid var(--border);
}
.page-label strong{font-size:13px;font-weight:600}
.project{
  margin:0 0 9px;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:#fff;
}
.project h3{margin:0 0 5px;color:var(--arcoblue);font-size:11px;font-weight:600}
.project p{margin:0;color:var(--text-2);font-size:10px;line-height:1.68}
.project-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.project-grid .project{display:grid;grid-template-columns:30px 1fr;gap:9px;align-items:start;margin:0;min-height:0;padding:11px 12px}
.leadership-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.leadership-grid .project{margin:0;min-height:172px;padding:12px}
.icon-card-copy h3{margin:0 0 4px}
.icon-card-copy p{margin:0}
.icon-badge{width:30px;height:30px;border-radius:8px;background:var(--blue-1);color:var(--arcoblue);display:flex;align-items:center;justify-content:center}
.arco-icon{width:17px;height:17px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.leadership-grid .icon-badge{margin-bottom:9px}
.leadership-grid .project h3{margin-bottom:7px}
.impact-list{margin:0;padding-left:14px;color:var(--text-2);font-size:10px;line-height:1.62}
.impact-list li{margin:0 0 5px;padding-left:1px}
.impact-list li:last-child{margin-bottom:0}
.impact-list strong{color:var(--ink);font-weight:600}
.continued{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;color:var(--text-3);font-size:9px}
.continued:before{content:&quot;&quot;;width:18px;height:1px;background:var(--blue-2)}
.project-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.status{color:var(--arcoblue);font-size:8.5px}
.detail{color:var(--text-3);font-size:8.5px;line-height:1.5}
.practice{
  margin:8px 0 12px;
  padding:8px 10px;
  border-radius:var(--radius);
  background:var(--blue-1);
}
.practice h3{margin:0 0 4px;font-size:10px}
.practice p{margin:0;color:var(--text-2);font-size:9px;line-height:1.55}
.education{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}
.education section{
  padding:10px 12px;
  border-top:2px solid var(--arcoblue);
  background:var(--fill);
}
.education h3{margin:0 0 4px;font-size:10px;font-weight:600}
.education p{margin:0;color:var(--text-3);font-size:10px;line-height:1.55}
.note{
  max-width:794px;
  margin:0 auto 30px;
  padding:0 12px;
  color:var(--text-3);
  font-size:11px;
  line-height:1.7;
}
a{color:var(--arcoblue);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
@media(max-width:830px){
  .page{width:calc(100% - 20px);min-height:auto;padding:26px 20px}
  .toolbar{margin-top:12px}
  header{grid-template-columns:1fr 70px;gap:12px}
  .photo{width:70px;height:90px}
  h1{font-size:28px}
  .intro{font-size:12px}
  .job ul,.project p{font-size:11px}
  .education{grid-template-columns:1fr}
  .project-grid,.leadership-grid{grid-template-columns:1fr}
  .footer{margin-top:20px}
}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  .toolbar,.gate-overlay{display:none}
  .page{
    width:210mm;
    height:297mm;
    min-height:0;
    margin:0;
    box-shadow:none;
    break-after:page;
    overflow:hidden;
    print-color-adjust:exact;
    -webkit-print-color-adjust:exact;
  }
  .page:last-of-type{break-after:auto}
  .job,.project{break-inside:avoid}
}

.gate-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(242,243,245,.72);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2)}
.gate-overlay.unlocked{display:none}
.gate-card{width:min(360px,100%);padding:28px;background:var(--paper);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(29,33,41,.14)}
.gate-eyebrow{color:var(--arcoblue);font-size:10px;font-weight:600;letter-spacing:1.8px}
.gate-title{margin:8px 0 18px;font-size:18px;font-weight:600;color:var(--ink)}
.gate-card input{width:100%;height:38px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius);font:inherit;font-size:14px;color:var(--ink);background:#fff;outline:none}
.gate-card input:focus{border-color:var(--arcoblue);box-shadow:0 0 0 3px var(--blue-2)}
.gate-error{margin:8px 0 0;color:#F53F3F;font-size:12px}
.gate-card button{width:100%;height:38px;margin-top:14px;border:1px solid var(--arcoblue);border-radius:var(--radius);background:var(--arcoblue);color:#fff;font-size:14px;cursor:pointer}
.gate-card button:hover{background:#0E42D2}
.toolbar{gap:8px}
[hidden]{display:none!important}
&lt;/style&gt;

&lt;div class=&quot;toolbar&quot;&gt;&lt;button id=&quot;langToggle&quot; type=&quot;button&quot; aria-label=&quot;Switch language&quot;&gt;EN&lt;/button&gt;&lt;button id=&quot;printBtn&quot; type=&quot;button&quot; onclick=&quot;window.print()&quot;&gt;打印 / 保存 PDF&lt;/button&gt;&lt;/div&gt;
&lt;main&gt;&lt;div id=&quot;lang-zh&quot;&gt;&lt;article class=&quot;page&quot; aria-label=&quot;简历第一页：系统体验与职业经历&quot;&gt;
&lt;header&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;UX Leadership · Product Innovation · Design Systems&lt;/div&gt;&lt;h1&gt;牟伟成&lt;/h1&gt;&lt;div class=&quot;role&quot;&gt;资深体验设计负责人&lt;/div&gt;&lt;div class=&quot;contact&quot;&gt;深圳 &amp;nbsp; / &amp;nbsp; 186 8039 1092 &amp;nbsp; / &amp;nbsp; mutong@vip.qq.com&lt;!-- portfolio link hidden until site ready --&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;photo&quot;&gt;&lt;img src=&quot;/portfolio/resume-portrait.png&quot; alt=&quot;牟伟成个人形象照&quot;&gt;&lt;/div&gt;&lt;/header&gt;
&lt;div class=&quot;profile-grid&quot;&gt;&lt;p class=&quot;profile-lead&quot;&gt;&lt;strong&gt;19 年用户体验设计经验&lt;/strong&gt;，职业经历横跨腾讯核心产品、现象级移动社交应用与 OPPO 操作系统。擅长从复杂业务中形成设计洞察，并将其转化为体验策略与设计体系；兼具 Design Lead、跨团队推动及人才梯队建设经验。从定义应用体验，到定义 OS 体验，再到跨端AI，判断 Agent OS 的价值在跨应用、跨设备的任务边界，体验工作的重心是让 Agent 操作可信、可见、可控、可逆。&lt;/p&gt;&lt;div class=&quot;metrics&quot;&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;10+ pp&lt;/b&gt;&lt;span&gt;ColorOS 版本设计满意度提升&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;40+&lt;/b&gt;&lt;span&gt;正式设计师管理带宽&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;5,000 万&lt;/b&gt;&lt;span&gt;全民 K 歌 2018 年峰值 DAU&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;capabilities&quot;&gt;&lt;span&gt;OS 设计规划与创新&lt;/span&gt;&lt;span&gt;Design System&lt;/span&gt;&lt;span&gt;信息架构与易用性&lt;/span&gt;&lt;span&gt;AI 原型实践&lt;/span&gt;&lt;span&gt;体验研究与度量&lt;/span&gt;&lt;/div&gt;
&lt;h2 class=&quot;section-title&quot;&gt;工作经历 &lt;small&gt;PROFESSIONAL EXPERIENCE&lt;/small&gt;&lt;/h2&gt;
&lt;div class=&quot;company&quot;&gt;&lt;h3&gt;OPPO&lt;span&gt;软件用户体验设计部&lt;/span&gt;&lt;/h3&gt;&lt;time&gt;2020.04 — 至今&lt;/time&gt;&lt;/div&gt;&lt;section class=&quot;job&quot;&gt;&lt;div class=&quot;jobhead&quot;&gt;&lt;h4&gt;生态互联体验主管&lt;/h4&gt;&lt;time&gt;2026.04 — 至今&lt;/time&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;目标与判断：&lt;/strong&gt;面向学习、办公、创作等目标用户，判断仅以手机为中心的架构难以承载生产力任务与未来主动智能体验。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;关键策略与成果：&lt;/strong&gt;提出无感连接、主动智能、平台化管理，推动 PC 客户端与一方设备成为跨端任务的重要载体。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;基础体验治理：&lt;/strong&gt;围绕“找不到、连不上”等问题建立产研责任与流转机制，已纳入项目化版本计划。&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;section class=&quot;job&quot;&gt;&lt;div class=&quot;jobhead&quot;&gt;&lt;h4&gt;部门交互专家／平台设计团队主管&lt;/h4&gt;&lt;time&gt;2023.01 — 2026.03&lt;/time&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;版本策略与结果：&lt;/strong&gt;担任 ColorOS 14—16 版本 UX 设计代表，统筹跨业务交付；建立系统一级门户重点变更机制，推动用户测试与横向评估。基于发布后统一市场调研，协同团队推动设计满意度提升超过 10 个百分点。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;体验方向与设计体系：&lt;/strong&gt;&lt;br&gt;基于用户洞察主导提出美学方向，带领平台团队定义公共控件与交互反馈，推动全系统一致落地及 &lt;a href=&quot;https://www.figma.com/community/file/1430008996536373272/coloros-15-ui-kit&quot;&gt;ColorOS 15&lt;/a&gt;、&lt;a href=&quot;https://www.figma.com/community/file/1572820051263618685/coloros-16-ui-kit&quot;&gt;16&lt;/a&gt; UI Kit 公开交付。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;全球化系统体验：&lt;/strong&gt;负责 OxygenOS 15、16 体验策略与门户场景定制，组织韩国专家、视觉与本地化团队完成交付，服务东南亚和印度用户。&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;section class=&quot;job&quot;&gt;&lt;div class=&quot;jobhead&quot;&gt;&lt;h4&gt;互联网服务 BU｜体验设计主管&lt;/h4&gt;&lt;time&gt;2020.04 — 2022.12&lt;/time&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;业务与组织：&lt;/strong&gt;&lt;br&gt;负责独立互联网服务 BU 全域体验设计，覆盖软件商店、浏览器、游戏中心及游戏助手；统筹商业化需求，管理 40+ 名正式设计师。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;研究与度量：&lt;/strong&gt;重组软件用户研究团队，建立围绕 NPS 的体验度量标准并推动长期运行：本品 NPS 按月反馈、竞品 NPS 对标行业地位与用户关注点；覆盖从互联网整体体验聚焦至用户量 Top 4 产品，机制延续至今。&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;div class=&quot;company&quot; style=&quot;margin-top:16px&quot;&gt;&lt;h3&gt;腾讯&lt;span&gt;交互设计与设计管理&lt;/span&gt;&lt;/h3&gt;&lt;time&gt;2007.08 — 2020.04&lt;/time&gt;&lt;/div&gt;&lt;section class=&quot;job&quot;&gt;&lt;div class=&quot;jobhead&quot;&gt;&lt;h4&gt;全民 K 歌设计总监&lt;/h4&gt;&lt;time&gt;2014 — 2020.04&lt;/time&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;现象级产品 0→1：&lt;/strong&gt;主导演唱创作、合唱、短视频、直播及歌房等核心体验，建立“音视频创作 × 关系链社交 × 实时互动”的产品框架；业务于 2018 年达到 &lt;strong&gt;5,000 万 DAU&lt;/strong&gt; 峰值，并获公司重大业务突破及 2018 年“名品堂”。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;产品矩阵与平台能力：&lt;/strong&gt;&lt;br&gt;带领团队拓展 WeSing 国际版、TV 版、音兔视频、QQ 音乐专辑等业务，构建设计中台、组件化规范与多产品协同能力。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;业务与经营协同：&lt;/strong&gt;参与业务商业计划制定，从经营视角整合资源、拆解阶段策略并推动设计团队落地。&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;section class=&quot;job&quot;&gt;&lt;div class=&quot;jobhead&quot;&gt;&lt;h4&gt;QQ 设计组长／高级交互设计师&lt;/h4&gt;&lt;time&gt;2007.08 — 2014&lt;/time&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;核心产品创新：&lt;/strong&gt;&lt;br&gt;负责 PC QQ 2010 改版、QQ 支付及 QQ 医生 1.0—3.0 等项目；QQ 约 2012 年达 5,000 万同时在线并获公司重大业务突破。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;系统规范建设：&lt;/strong&gt;负责 QQ 业务系统级交互规范，参与定义腾讯体验设计原则，将多产品实践沉淀为可复用的体验标准。&lt;/li&gt;&lt;li&gt;&lt;strong&gt;复杂产品与国际协作：&lt;/strong&gt;主导腾讯充值、QQ／微信虚拟支付及腾讯分析等 Web／移动产品的全链路体验规划；兼任原型工具 UIDesigner 产品 PO，并赴泰国 Sanook 交流指导改版。&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
&lt;footer class=&quot;footer&quot;&gt;&lt;span&gt;01 / 02&lt;/span&gt;&lt;/footer&gt;&lt;/article&gt;&lt;article class=&quot;page&quot; aria-label=&quot;简历第二页：AI 实践与专业建设&quot;&gt;&lt;div class=&quot;page-label&quot;&gt;&lt;strong&gt;牟伟成 &lt;span style=&quot;font-weight:400;color:var(--text-3)&quot;&gt;/ 资深体验设计负责人&lt;/span&gt;&lt;/strong&gt;&lt;span class=&quot;eyebrow&quot;&gt;Practice &amp;amp; Leadership&lt;/span&gt;&lt;/div&gt;
&lt;h2 class=&quot;section-title&quot;&gt;AI 与原型实践 &lt;small&gt;APPLIED AI &amp;amp; PROTOTYPING&lt;/small&gt;&lt;/h2&gt;&lt;p class=&quot;intro&quot; style=&quot;margin:0 0 12px&quot;&gt;2025 年起将 AI 用于研究、总结与方案讨论；2026 年进一步深入 Agent、可运行原型与设计工作流。&lt;/p&gt;&lt;div class=&quot;project-grid&quot;&gt;&lt;section class=&quot;project&quot;&gt;&lt;span class=&quot;icon-badge&quot; title=&quot;Arco IconBook&quot;&gt;&lt;svg class=&quot;arco-icon&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z&quot;/&gt;&lt;path d=&quot;M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5A2.5 2.5 0 0 1 20 21V5.5Z&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;div class=&quot;icon-card-copy&quot;&gt;&lt;h3&gt;知识驱动的设计工作流&lt;/h3&gt;&lt;p&gt;分层组织产品定义、Design Token、场景组件及交互逻辑，对齐 Figma UI 库；接入 Android Compose 控件，结合业务知识搭建可运行的高保真 Demo。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;project&quot;&gt;&lt;span class=&quot;icon-badge&quot; title=&quot;Arco IconLink&quot;&gt;&lt;svg class=&quot;arco-icon&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;3&quot; y=&quot;5&quot; width=&quot;7&quot; height=&quot;12&quot; rx=&quot;1.5&quot;/&gt;&lt;rect x=&quot;14&quot; y=&quot;7&quot; width=&quot;7&quot; height=&quot;12&quot; rx=&quot;1.5&quot;/&gt;&lt;path d=&quot;M10 10h4M10 14h4&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;div class=&quot;icon-card-copy&quot;&gt;&lt;h3&gt;跨设备AI产品创新&lt;/h3&gt;&lt;p&gt;围绕耳机、手机与模型协同，探索会议洞察、知识沉淀及主动服务体验，持续验证 AI 能力如何进入真实任务链路。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;project&quot;&gt;&lt;span class=&quot;icon-badge&quot; title=&quot;Arco IconCode&quot;&gt;&lt;svg class=&quot;arco-icon&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;div class=&quot;icon-card-copy&quot;&gt;&lt;h3&gt;技术体验创新设计&lt;/h3&gt;&lt;p&gt;独立整合研发算法与高保真前台交互为运行原型，以真实技术输出验证完整体验、暴露约束并推动团队判断。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;project&quot;&gt;&lt;span class=&quot;icon-badge&quot; title=&quot;Arco IconVoice&quot;&gt;&lt;svg class=&quot;arco-icon&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;9&quot; y=&quot;3&quot; width=&quot;6&quot; height=&quot;11&quot; rx=&quot;3&quot;/&gt;&lt;path d=&quot;M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;div class=&quot;icon-card-copy&quot;&gt;&lt;h3&gt;语音日记与个人记忆&lt;/h3&gt;&lt;p&gt;构建并部署个人 AI 产品，结合本地语音模型与分层数据库，探索从自然记录、结构化整理到叙事生成及周期洞察的完整体验。&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;h2 class=&quot;section-title&quot;&gt;组织建设与专业影响力 &lt;small&gt;LEADERSHIP &amp;amp; CONTRIBUTION&lt;/small&gt;&lt;/h2&gt;
&lt;div class=&quot;leadership-grid&quot;&gt;&lt;section class=&quot;project&quot;&gt;&lt;span class=&quot;icon-badge&quot; title=&quot;Arco IconUserGroup&quot;&gt;&lt;svg class=&quot;arco-icon&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;9&quot; cy=&quot;8&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;17&quot; cy=&quot;9&quot; r=&quot;2.5&quot;/&gt;&lt;path d=&quot;M3.5 20a5.5 5.5 0 0 1 11 0M14 15.5a4.5 4.5 0 0 1 6.5 4&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;h3&gt;人才与专业体系&lt;/h3&gt;&lt;ul class=&quot;impact-list&quot;&gt;&lt;li&gt;OPPO期间，培养 3 位设计师成长为&lt;strong&gt;部门主管&lt;/strong&gt;，并已完成正式任命晋升；通过目标拆解与设计评审，带教专业人才梯队。&lt;/li&gt;&lt;li&gt;担任 OPPO 设计通道委员及内部讲师；曾任腾讯设计通道委员、腾讯学院高级讲师，并主要负责交互岗位能力模型的内容撰写与定义完善。&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;section class=&quot;project&quot;&gt;&lt;span class=&quot;icon-badge&quot; title=&quot;Arco IconPublic&quot;&gt;&lt;svg class=&quot;arco-icon&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;3&quot; y=&quot;4&quot; width=&quot;18&quot; height=&quot;12&quot; rx=&quot;2&quot;/&gt;&lt;path d=&quot;M8 20h8M12 16v4M7 12l3-3 2 2 4-4&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;h3&gt;行业交流&lt;/h3&gt;&lt;p&gt;2025 年任 OPPO 开发者大会设计分论坛总负责人及内容策划；2024 年作为&lt;a href=&quot;https://news.zol.com.cn/910/9103837.html&quot;&gt;体验设计分论坛&lt;/a&gt;演讲者。外部行业交流包括：&lt;a href=&quot;https://www.di-award.org/zh/press/detail/946.html.html&quot;&gt;2023 中国设计智造创新学术研讨会&lt;/a&gt;受邀发表《终端软件创新》主题演讲、&lt;a href=&quot;https://new.msup.com.cn/teacher/8694&quot;&gt;HiPM 产品创新力峰会&lt;/a&gt;分享《终端互联网设计》，以及参与 &lt;a href=&quot;https://uxpa.org.cn/2025/02/20/2024uf%E5%A4%A7%E4%BC%9A%C2%B7%E6%9C%AA%E6%9D%A5%E7%94%9F%E6%B4%BB%E5%B3%B0%E4%BC%9A%E5%9B%9E%E9%A1%BE%EF%BD%9Cai%E9%87%8D%E5%A1%91%E4%BA%BA%E7%B1%BB%E7%94%9F%E6%B4%BB%E7%9A%84%E6%9C%AA%E6%9D%A5/&quot;&gt;2024 User Friendly 国际用户体验大会&lt;/a&gt;交流。&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;project&quot;&gt;&lt;span class=&quot;icon-badge&quot; title=&quot;Arco IconTrophy&quot;&gt;&lt;svg class=&quot;arco-icon&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M7 4h10v4a5 5 0 0 1-10 0V4ZM9 18h6M12 13v5M7 6H4v2a4 4 0 0 0 4 4M17 6h3v2a4 4 0 0 1-4 4M8 21h8&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;h3&gt;专业成果&lt;/h3&gt;&lt;ul class=&quot;impact-list&quot;&gt;&lt;li&gt;参与编写腾讯用户体验设计专业书籍《在你身边，为你设计》，沉淀大型互联网产品的体验实践。&lt;/li&gt;&lt;li&gt;腾讯 2010—2019 年间，以署名发明人／设计人身份获得 &lt;strong&gt;20+ 项授权专利&lt;/strong&gt;。&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;/div&gt;
&lt;div class=&quot;education&quot;&gt;&lt;section&gt;&lt;h3&gt;教育经历&lt;/h3&gt;&lt;p&gt;西安交通大学 · 工业设计&lt;br&gt;工学学士 · 2003—2007（人机界面方向）&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;作品与演示&lt;/h3&gt;&lt;p&gt;&lt;!-- portfolio link hidden until site ready --&gt;&lt;a href=&quot;https://www.figma.com/community/file/1430008996536373272/coloros-15-ui-kit&quot;&gt;ColorOS 15 UI Kit&lt;/a&gt;、&lt;a href=&quot;https://www.figma.com/community/file/1572820051263618685/coloros-16-ui-kit&quot;&gt;ColorOS 16 UI Kit&lt;/a&gt;（Figma Community 公开交付）&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;
&lt;footer class=&quot;footer&quot;&gt;&lt;span&gt;02 / 02&lt;/span&gt;&lt;/footer&gt;&lt;/article&gt;&lt;/div&gt;&lt;div id=&quot;lang-en&quot; hidden&gt;&lt;article class=&quot;page&quot; aria-label=&quot;Resume, page 1: system experience and career history&quot;&gt;
&lt;header&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;UX Leadership · Product Innovation · Design Systems&lt;/div&gt;&lt;h1&gt;Michael Mu&lt;/h1&gt;&lt;div class=&quot;role&quot;&gt;Senior Experience Design Leader&lt;/div&gt;&lt;div class=&quot;contact&quot;&gt;Shenzhen &amp;nbsp; / &amp;nbsp; 186 8039 1092 &amp;nbsp; / &amp;nbsp; mutong@vip.qq.com&lt;!-- portfolio link hidden until site ready --&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;photo&quot;&gt;&lt;img src=&quot;/portfolio/resume-portrait.png&quot; alt=&quot;Portrait of Michael Mu&quot;&gt;&lt;/div&gt;&lt;/header&gt;
&lt;div class=&quot;profile-grid&quot;&gt;&lt;p class=&quot;profile-lead&quot;&gt;&lt;strong&gt;19 years of UX design&lt;/strong&gt; across Tencent&#x27;s core products, a breakout mobile social app, and OPPO&#x27;s operating system. I turn design insight from complex businesses into experience strategy and design systems — as a design lead, cross-team driver, and mentor of design talent. From app experience to OS experience to cross-device AI: an agent OS creates value at the boundaries of cross-app, cross-device tasks, and experience work must make agent actions trustworthy, visible, controllable, and reversible.&lt;/p&gt;&lt;div class=&quot;metrics&quot;&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;10+ pp&lt;/b&gt;&lt;span&gt;Improvement in ColorOS design satisfaction&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;40+&lt;/b&gt;&lt;span&gt;Full-time designers managed&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;metric&quot;&gt;&lt;b&gt;50M&lt;/b&gt;&lt;span&gt;WeSing peak DAU, 2018&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;capabilities&quot;&gt;&lt;span&gt;OS Experience Planning &amp;amp; Innovation&lt;/span&gt;&lt;span&gt;Design System&lt;/span&gt;&lt;span&gt;Information Architecture &amp;amp; Usability&lt;/span&gt;&lt;span&gt;AI Prototyping Practice&lt;/span&gt;&lt;span&gt;Experience Research &amp;amp; Measurement&lt;/span&gt;&lt;/div&gt;
&lt;h2 class=&quot;section-title&quot;&gt;Professional Experience&lt;/h2&gt;
&lt;div class=&quot;company&quot;&gt;&lt;h3&gt;OPPO&lt;span&gt;Software User Experience Design&lt;/span&gt;&lt;/h3&gt;&lt;time&gt;Apr 2020 — Present&lt;/time&gt;&lt;/div&gt;&lt;section class=&quot;job&quot;&gt;&lt;div class=&quot;jobhead&quot;&gt;&lt;h4&gt;Ecosystem Interconnect Experience Lead&lt;/h4&gt;&lt;time&gt;Apr 2026 — Present&lt;/time&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Goals &amp;amp; Judgment:&lt;/strong&gt; For target users in learning, work, and creation, I judged that a phone-centric architecture alone cannot carry productivity tasks and future proactive intelligent experiences.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Key Strategies &amp;amp; Outcomes:&lt;/strong&gt; Proposed seamless connection, proactive intelligence, and platform-based management, making PC clients and first-party devices key carriers of cross-device tasks.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Foundational Experience Governance:&lt;/strong&gt; Built engineering and QA ownership and triage processes around issues like “cannot find / cannot connect”, now part of release planning.&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;section class=&quot;job&quot;&gt;&lt;div class=&quot;jobhead&quot;&gt;&lt;h4&gt;Department Interaction Expert &amp;amp; Platform Design Team Lead&lt;/h4&gt;&lt;time&gt;Jan 2023 — Mar 2026&lt;/time&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Release Strategy &amp;amp; Outcomes:&lt;/strong&gt; Served as UX design representative for ColorOS 14–16, coordinating cross-business delivery; set up a review mechanism for system-level key changes, driving user testing and horizontal evaluation. Based on unified post-release market research, worked with the team to lift design satisfaction by over 10 percentage points.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Experience Direction &amp;amp; Design System:&lt;/strong&gt;&lt;br&gt;Led the aesthetic direction from user insight, guiding the platform team to define common controls and interaction feedback, driving consistent system-wide implementation and the public release of the &lt;a href=&quot;https://www.figma.com/community/file/1430008996536373272/coloros-15-ui-kit&quot;&gt;ColorOS 15&lt;/a&gt; and &lt;a href=&quot;https://www.figma.com/community/file/1572820051263618685/coloros-16-ui-kit&quot;&gt;16&lt;/a&gt; UI Kits.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Global System Experience:&lt;/strong&gt; Owned experience strategy and portal-scenario customization for OxygenOS 15 and 16, coordinating Korean specialists and visual and localization teams to deliver for Southeast Asian and Indian users.&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;section class=&quot;job&quot;&gt;&lt;div class=&quot;jobhead&quot;&gt;&lt;h4&gt;Internet Services BU, Experience Design Lead&lt;/h4&gt;&lt;time&gt;Apr 2020 — Dec 2022&lt;/time&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Business &amp;amp; Organization:&lt;/strong&gt;&lt;br&gt;Owned end-to-end experience design for the standalone internet services BU — app store, browser, game center, and game assistant — balancing commercialization needs while managing 40+ full-time designers.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Research &amp;amp; Measurement:&lt;/strong&gt; Rebuilt the software user research team and established NPS-based experience measurement standards as an ongoing practice: own-brand NPS reported monthly and competitor NPS benchmarked against industry position and user concerns, with coverage focusing from the full internet experience to the top 4 products by user volume — a mechanism that continues today.&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;div class=&quot;company&quot; style=&quot;margin-top:16px&quot;&gt;&lt;h3&gt;Tencent&lt;span&gt;Interaction Design &amp;amp; Design Management&lt;/span&gt;&lt;/h3&gt;&lt;time&gt;Aug 2007 — Apr 2020&lt;/time&gt;&lt;/div&gt;&lt;section class=&quot;job&quot;&gt;&lt;div class=&quot;jobhead&quot;&gt;&lt;h4&gt;WeSing Design Director&lt;/h4&gt;&lt;time&gt;2014 — Apr 2020&lt;/time&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Breakout Product, 0→1:&lt;/strong&gt; Led core experiences in singing creation, chorus, short video, livestream, and song rooms, establishing the “audio-video creation × relationship social × real-time interaction” product framework; the business reached a &lt;strong&gt;50 million DAU&lt;/strong&gt; peak in 2018 and earned the company&#x27;s major business breakthrough award and the 2018 “Mingpin Hall” (名品堂) honor.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Product Matrix &amp;amp; Platform Capabilities:&lt;/strong&gt;&lt;br&gt;Led the team in expanding WeSing International, the TV version, Yintu Video, and QQ Music digital albums, building the design platform, component standards, and multi-product collaboration capabilities.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Business &amp;amp; Operations Alignment:&lt;/strong&gt; Joined business planning, aligning resources from a business perspective, breaking down phased strategies, and driving the design team to deliver.&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;section class=&quot;job&quot;&gt;&lt;div class=&quot;jobhead&quot;&gt;&lt;h4&gt;QQ Design Team Lead / Senior Interaction Designer&lt;/h4&gt;&lt;time&gt;Aug 2007 — 2014&lt;/time&gt;&lt;/div&gt;&lt;ul&gt;&lt;li&gt;&lt;strong&gt;Core Product Innovation:&lt;/strong&gt;&lt;br&gt;Led the PC QQ 2010 redesign, QQ Pay, and QQ Doctor 1.0–3.0; QQ reached about 50 million concurrent users online around 2012 and earned the company&#x27;s major business breakthrough award.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;System Standards:&lt;/strong&gt; Owned system-level interaction specifications for QQ, contributed to Tencent&#x27;s experience design principles, and distilled multi-product practice into reusable experience standards.&lt;/li&gt;&lt;li&gt;&lt;strong&gt;Complex Products &amp;amp; International Collaboration:&lt;/strong&gt; Led end-to-end experience planning for Tencent Recharge, QQ/WeChat virtual payments, and Tencent Analytics web and mobile products; served as product owner for the UIDesigner prototyping tool and advised Sanook in Thailand on its redesign.&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;
&lt;footer class=&quot;footer&quot;&gt;&lt;span&gt;01 / 02&lt;/span&gt;&lt;/footer&gt;&lt;/article&gt;&lt;article class=&quot;page&quot; aria-label=&quot;Resume, page 2: AI practice and professional growth&quot;&gt;&lt;div class=&quot;page-label&quot;&gt;&lt;strong&gt;Michael Mu &lt;span style=&quot;font-weight:400;color:var(--text-3)&quot;&gt;/ Senior Experience Design Leader&lt;/span&gt;&lt;/strong&gt;&lt;span class=&quot;eyebrow&quot;&gt;Practice &amp;amp; Leadership&lt;/span&gt;&lt;/div&gt;
&lt;h2 class=&quot;section-title&quot;&gt;Applied AI &amp;amp; Prototyping&lt;/h2&gt;&lt;p class=&quot;intro&quot; style=&quot;margin:0 0 12px&quot;&gt;Since 2025, I have used AI for research, synthesis, and design discussions; in 2026 I went deeper into agents, runnable prototypes, and design workflows.&lt;/p&gt;&lt;div class=&quot;project-grid&quot;&gt;&lt;section class=&quot;project&quot;&gt;&lt;span class=&quot;icon-badge&quot; title=&quot;Arco IconBook&quot;&gt;&lt;svg class=&quot;arco-icon&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z&quot;/&gt;&lt;path d=&quot;M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5A2.5 2.5 0 0 1 20 21V5.5Z&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;div class=&quot;icon-card-copy&quot;&gt;&lt;h3&gt;Knowledge-Driven Design Workflow&lt;/h3&gt;&lt;p&gt;Organize product definitions, design tokens, scenario components, and interaction logic in layers, aligned with the Figma UI library; integrate Android Compose controls and business knowledge to build runnable high-fidelity demos.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;project&quot;&gt;&lt;span class=&quot;icon-badge&quot; title=&quot;Arco IconLink&quot;&gt;&lt;svg class=&quot;arco-icon&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;3&quot; y=&quot;5&quot; width=&quot;7&quot; height=&quot;12&quot; rx=&quot;1.5&quot;/&gt;&lt;rect x=&quot;14&quot; y=&quot;7&quot; width=&quot;7&quot; height=&quot;12&quot; rx=&quot;1.5&quot;/&gt;&lt;path d=&quot;M10 10h4M10 14h4&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;div class=&quot;icon-card-copy&quot;&gt;&lt;h3&gt;Cross-Device AI Product Innovation&lt;/h3&gt;&lt;p&gt;Explore meeting insights, knowledge capture, and proactive service experiences across earphones, phone, and models, continuously validating how AI capabilities enter real task flows.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;project&quot;&gt;&lt;span class=&quot;icon-badge&quot; title=&quot;Arco IconCode&quot;&gt;&lt;svg class=&quot;arco-icon&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;div class=&quot;icon-card-copy&quot;&gt;&lt;h3&gt;Technology Experience Innovation Design&lt;/h3&gt;&lt;p&gt;Independently integrate R&amp;D algorithms with high-fidelity front-end interaction into runnable prototypes, validating the full experience against real technical output, exposing constraints, and driving team decisions.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;project&quot;&gt;&lt;span class=&quot;icon-badge&quot; title=&quot;Arco IconVoice&quot;&gt;&lt;svg class=&quot;arco-icon&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;9&quot; y=&quot;3&quot; width=&quot;6&quot; height=&quot;11&quot; rx=&quot;3&quot;/&gt;&lt;path d=&quot;M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;div class=&quot;icon-card-copy&quot;&gt;&lt;h3&gt;Voice Journal &amp;amp; Personal Memory&lt;/h3&gt;&lt;p&gt;Built and deployed a personal AI product combining on-device speech models with a layered database, exploring the full experience from natural recording and structured organization to narrative generation and periodic insight.&lt;/p&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;&lt;h2 class=&quot;section-title&quot;&gt;Leadership &amp;amp; Contribution&lt;/h2&gt;
&lt;div class=&quot;leadership-grid&quot;&gt;&lt;section class=&quot;project&quot;&gt;&lt;span class=&quot;icon-badge&quot; title=&quot;Arco IconUserGroup&quot;&gt;&lt;svg class=&quot;arco-icon&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;9&quot; cy=&quot;8&quot; r=&quot;3&quot;/&gt;&lt;circle cx=&quot;17&quot; cy=&quot;9&quot; r=&quot;2.5&quot;/&gt;&lt;path d=&quot;M3.5 20a5.5 5.5 0 0 1 11 0M14 15.5a4.5 4.5 0 0 1 6.5 4&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;h3&gt;Talent &amp;amp; Professional System&lt;/h3&gt;&lt;ul class=&quot;impact-list&quot;&gt;&lt;li&gt;At OPPO, mentored 3 designers into &lt;strong&gt;department-head roles&lt;/strong&gt; with formal appointments; coached the professional talent pipeline through goal breakdown and design reviews.&lt;/li&gt;&lt;li&gt;Serving on OPPO&#x27;s design career committee and as an internal trainer; previously served on Tencent&#x27;s design career committee and as a senior lecturer at Tencent Academy, leading the definition of the interaction design competency model.&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;section class=&quot;project&quot;&gt;&lt;span class=&quot;icon-badge&quot; title=&quot;Arco IconPublic&quot;&gt;&lt;svg class=&quot;arco-icon&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;rect x=&quot;3&quot; y=&quot;4&quot; width=&quot;18&quot; height=&quot;12&quot; rx=&quot;2&quot;/&gt;&lt;path d=&quot;M8 20h8M12 16v4M7 12l3-3 2 2 4-4&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;h3&gt;Industry Engagement&lt;/h3&gt;&lt;p&gt;In 2025, I led the design track at the OPPO Developer Conference as track lead and content planner; in 2024, I spoke at the &lt;a href=&quot;https://news.zol.com.cn/910/9103837.html&quot;&gt;experience design track&lt;/a&gt;. Other engagements include: &lt;a href=&quot;https://www.di-award.org/zh/press/detail/946.html.html&quot;&gt;the 2023 China Design &amp;amp; Intelligent Manufacturing Innovation Symposium&lt;/a&gt;where I gave the keynote “Terminal Software Innovation”, &lt;a href=&quot;https://new.msup.com.cn/teacher/8694&quot;&gt;the HiPM Product Innovation Summit&lt;/a&gt;where I shared “Terminal Internet Design”, and took part in  &lt;a href=&quot;https://uxpa.org.cn/2025/02/20/2024uf%E5%A4%A7%E4%BC%9A%C2%B7%E6%9C%AA%E6%9D%A5%E7%94%9F%E6%B4%BB%E5%B3%B0%E4%BC%9A%E5%9B%9E%E9%A1%BE%EF%BD%9Cai%E9%87%8D%E5%A1%91%E4%BA%BA%E7%B1%BB%E7%94%9F%E6%B4%BB%E7%9A%84%E6%9C%AA%E6%9D%A5/&quot;&gt;the 2024 User Friendly International UX Conference&lt;/a&gt;.&lt;/p&gt;&lt;/section&gt;&lt;section class=&quot;project&quot;&gt;&lt;span class=&quot;icon-badge&quot; title=&quot;Arco IconTrophy&quot;&gt;&lt;svg class=&quot;arco-icon&quot; viewBox=&quot;0 0 24 24&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M7 4h10v4a5 5 0 0 1-10 0V4ZM9 18h6M12 13v5M7 6H4v2a4 4 0 0 0 4 4M17 6h3v2a4 4 0 0 1-4 4M8 21h8&quot;/&gt;&lt;/svg&gt;&lt;/span&gt;&lt;h3&gt;Professional Achievements&lt;/h3&gt;&lt;ul class=&quot;impact-list&quot;&gt;&lt;li&gt;Co-authored Tencent&#x27;s UX design book 《在你身边，为你设计》, distilling experience from large-scale internet products.&lt;/li&gt;&lt;li&gt;At Tencent from 2010 to 2019, named inventor/designer on &lt;strong&gt;20+ granted patents&lt;/strong&gt;.&lt;/li&gt;&lt;/ul&gt;&lt;/section&gt;&lt;/div&gt;
&lt;div class=&quot;education&quot;&gt;&lt;section&gt;&lt;h3&gt;Education&lt;/h3&gt;&lt;p&gt;Xi&#x27;an Jiaotong University · Industrial Design&lt;br&gt;B.Eng · 2003–2007 (HCI focus)&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Work &amp;amp; Demos&lt;/h3&gt;&lt;p&gt;&lt;!-- portfolio link hidden until site ready --&gt;&lt;a href=&quot;https://www.figma.com/community/file/1430008996536373272/coloros-15-ui-kit&quot;&gt;ColorOS 15 UI Kit&lt;/a&gt; and &lt;a href=&quot;https://www.figma.com/community/file/1572820051263618685/coloros-16-ui-kit&quot;&gt;ColorOS 16 UI Kit&lt;/a&gt;(published on Figma Community)&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;
&lt;footer class=&quot;footer&quot;&gt;&lt;span&gt;02 / 02&lt;/span&gt;&lt;/footer&gt;&lt;/article&gt;&lt;/div&gt;&lt;/main&gt;
